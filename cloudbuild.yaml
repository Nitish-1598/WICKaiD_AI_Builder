# Google Cloud Build & Cloud Run Deployment Pipeline
steps:
  # 1. Build Multi-Stage Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/capsule-ai-unified-platform:latest'
      - '.'

  # 2. Push Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/capsule-ai-unified-platform:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'capsule-ai-unified-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/capsule-ai-unified-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,BIGQUERY_DATASET=enterprise_bi'

images:
  - 'gcr.io/$PROJECT_ID/capsule-ai-unified-platform:latest'
